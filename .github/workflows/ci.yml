name: TRINEX Admin CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform scaffolding
        run: flutter create --platforms=android,ios,windows .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Static analysis
        # Keep analyzer errors and warnings fatal; style/info lints are reported but do not fail CI.
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test

  build-android-apk:
    name: Build Android APK (local install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        run: flutter create --platforms=android .
      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          import re
          found = False
          for path in candidates:
              if not path.exists():
                  continue
              content = path.read_text()
              if re.search(r'compileSdk\s*=\s*36\b|compileSdkVersion\s+36\b', content):
                  found = True
                  continue
              updated, count = re.subn(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', content, count=1)
              if count == 0:
                  updated, count = re.subn(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 36', content, count=1)
              if count:
                  path.write_text(updated)
                  found = True
          if not found:
              raise SystemExit('Could not locate Flutter compileSdk declaration in generated Android Gradle files.')
          PYCODE
      - run: flutter pub get
      - name: Build APK only (no app bundle)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: trinex-admin-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows scaffolding
        run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: trinex-admin-windows
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS simulator (unsigned validation)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS scaffolding
        run: flutter create --platforms=ios .
      - run: flutter pub get
      - name: Compile iOS simulator without signing
        # Flutter does not support release-mode builds for the iOS simulator.
        run: flutter build ios --simulator --debug --no-codesign
