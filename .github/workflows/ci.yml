name: TRINEX Admin CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform scaffolding
        run: flutter create --platforms=android,ios,windows .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Static analysis
        # Keep analyzer errors and warnings fatal; style/info lints are reported but do not fail CI.
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test

  build-android-apk:
    name: Build Android APK (local install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        run: flutter create --platforms=android .
      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          import re
          found = False
          for path in candidates:
              if not path.exists():
                  continue
              content = path.read_text()
              if re.search(r'compileSdk\s*=\s*36\b|compileSdkVersion\s+36\b', content):
                  found = True
                  continue
              updated, count = re.subn(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', content, count=1)
              if count == 0:
                  updated, count = re.subn(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 36', content, count=1)
              if count:
                  path.write_text(updated)
                  found = True
          if not found:
              raise SystemExit('Could not locate Flutter compileSdk declaration in generated Android Gradle files.')
          PYCODE
      - run: flutter pub get
      - name: Enforce Android compile SDK 36 for app and Flutter plugins
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, os, re
          from urllib.parse import unquote, urlparse

          roots = [Path('android')]
          pub_cache = Path(os.environ.get('PUB_CACHE', str(Path.home() / '.pub-cache')))
          for hosted_name in ('pub.dev', 'pub.dartlang.org'):
              hosted = pub_cache / 'hosted' / hosted_name
              if hosted.exists():
                  roots.append(hosted)

          # Resolve the exact package roots Flutter selected, rather than assuming
          # a particular Pub cache layout.
          config = Path('.dart_tool/package_config.json')
          package_roots = {}
          if config.exists():
              data = json.loads(config.read_text())
              for package in data.get('packages', []):
                  uri = package.get('rootUri', '')
                  if uri.startswith('file:'):
                      parsed = urlparse(uri)
                      root = Path(unquote(parsed.path))
                  else:
                      root = (config.parent / unquote(uri)).resolve()
                  package_roots[package.get('name', '')] = root

          candidates = set()
          for root in roots:
              if root.exists():
                  candidates.update(root.rglob('build.gradle'))
                  candidates.update(root.rglob('build.gradle.kts'))
          for name in ('file_picker', 'flutter_plugin_android_lifecycle'):
              root = package_roots.get(name)
              if root:
                  candidates.update(root.glob('android/build.gradle'))
                  candidates.update(root.glob('android/build.gradle.kts'))

          # Handles all common forms, including `compileSdk flutter.compileSdkVersion`
          # and `compileSdk = flutter.compileSdkVersion` used by plugin Gradle files.
          sdk_line = re.compile(r'(?m)^([ \t]*)compileSdk(?:Version)?\b[^\n]*$')
          touched = []
          for path in sorted(candidates):
              if not path.is_file():
                  continue
              content = path.read_text()
              if not sdk_line.search(content):
                  continue
              replacement = r'\g<1>' + ('compileSdk = 36' if path.name.endswith('.kts') else 'compileSdkVersion 36')
              updated, count = sdk_line.subn(replacement, content)
              if count:
                  path.write_text(updated)
                  touched.append(str(path))

          app_files = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          if not any(p.exists() and re.search(r'(?m)^\s*compileSdk(?:Version)?(?:\s*=)?\s*36\b', p.read_text()) for p in app_files):
              raise SystemExit('Failed to set the application compile SDK to 36.')

          for name in ('file_picker', 'flutter_plugin_android_lifecycle'):
              root = package_roots.get(name)
              if not root:
                  raise SystemExit(f'Flutter package {name} was not found in .dart_tool/package_config.json.')
              gradle_files = list(root.glob('android/build.gradle')) + list(root.glob('android/build.gradle.kts'))
              if not gradle_files:
                  raise SystemExit(f'Android Gradle file for {name} was not found at {root}.')
              for path in gradle_files:
                  content = path.read_text()
                  if not re.search(r'(?m)^\s*compileSdk(?:Version)?(?:\s*=)?\s*36\b', content):
                      raise SystemExit(f'{name} compile SDK was not updated to 36 in {path}.')

          print(f'Enforced compile SDK 36 in {len(touched)} Gradle file(s).')
          print('\n'.join(touched))
          PYCODE
      - name: Build APK only (no app bundle)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: trinex-admin-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows scaffolding
        run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: trinex-admin-windows
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS simulator (unsigned validation)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS scaffolding
        run: flutter create --platforms=ios .
      - run: flutter pub get
      - name: Compile iOS simulator without signing
        # Flutter does not support release-mode builds for the iOS simulator.
        run: flutter build ios --simulator --debug --no-codesign
